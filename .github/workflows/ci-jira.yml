name: CI and Jira Sync

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - closed

jobs:
  push-ci-and-in-progress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Validate branch naming
        shell: bash
        run: |
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          allowed='^(main|develop|release/[0-9]+\.[0-9]+\.[0-9]+|feature/ED-[0-9]+[-a-z0-9_]*|fix/ED-[0-9]+[-a-z0-9_]*|hotfix/ED-[0-9]+[-a-z0-9_]*|chore/ED-[0-9]+[-a-z0-9_]*)$'
          if [[ ! "$branch" =~ $allowed ]]; then
            echo "Branch name '$branch' does not match the required pattern."
            echo "Use main, develop, release/x.y.z, feature/ED-123-desc, fix/ED-123-desc, hotfix/ED-123-desc, or chore/ED-123-desc."
            exit 1
          fi

      - name: Extract Jira issue keys
        id: jira_keys
        shell: bash
        run: |
          branch="${{ github.ref_name }}"
          branch_type="other"
          primary_key=""
          is_module_parent="false"

          if [[ "$branch" =~ ^(feature|fix|hotfix|chore)/(ED-[0-9]+)(-|$) ]]; then
            branch_type="${BASH_REMATCH[1]}"
            primary_key="${BASH_REMATCH[2]}"
          fi

          if [[ "$primary_key" =~ ^ED-(21|22|23)$ ]]; then
            is_module_parent="true"
          fi

          echo "branch_type=$branch_type" >> "$GITHUB_OUTPUT"
          echo "branch_key=$primary_key" >> "$GITHUB_OUTPUT"
          echo "keys=$primary_key" >> "$GITHUB_OUTPUT"
          echo "is_module_parent=$is_module_parent" >> "$GITHUB_OUTPUT"

          echo "Detected branch type: $branch_type"
          echo "Jira key detected: $([[ -n "$primary_key" ]] && echo true || echo false)"
          echo "Raw branch and Jira key are not printed because GitHub may mask text matching a secret."

      - name: Validate Postman collection
        id: postman_validation
        shell: bash
        run: |
          set -o pipefail
          # Tự động phát hiện file json của Postman dù Tiến đặt tên gì ở thư mục gốc
          POSTMAN_FILE=$(find . -maxdepth 1 -name "*.postman_collection.json" | head -n 1)
          if [ -f "$POSTMAN_FILE" ]; then
            node .github/scripts/validate-postman.mjs "$POSTMAN_FILE" 2>&1 | tee postman-validation.log
          else
            echo "No Postman file found in root, fallback to default path"
            node .github/scripts/validate-postman.mjs ./ev-dealer-management/ev-dealer-management/EV\ Dealer\ Management\ API.postman_collection.json 2>&1 | tee postman-validation.log
          fi

      - name: Restore solution
        run: dotnet restore ev-dealer-management/ev-dealer-management/DealerSystem.sln

      - name: Build solution
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet build ev-dealer-management/ev-dealer-management/DealerSystem.sln --configuration Release --no-restore 2>&1 | tee dotnet-build.log

      - name: Run Unit Tests
        id: unit_tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test ev-dealer-management/ev-dealer-management/DealerSystem.sln \
            --configuration Release \
            --no-build \
            --logger "console;verbosity=normal" 2>&1 | tee unit-test.log

      - name: Start backend services
        id: services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          wait_for_port() {
            local port="$1"
            local name="$2"
            for _ in $(seq 1 60); do
              if timeout 1 bash -c "</dev/tcp/127.0.0.1/${port}" >/dev/null 2>&1; then
                echo "${name} is ready on ${port}"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for ${name} on port ${port}"
            exit 1
          }

          start_service() {
            local name="$1"
            local port="$2"
            local project="$3"
            echo "Starting ${name} on ${port}"
            nohup env ASPNETCORE_URLS="http://127.0.0.1:${port}" dotnet run --project "${project}" --no-launch-profile > "ci-logs/${name}.log" 2>&1 &
          }

          docker compose -f ev-dealer-management/ev-dealer-management/docker-compose.yml up -d rabbitmq

          start_service UserService 7001 ev-dealer-management/ev-dealer-management/UserService/UserService.csproj
          start_service CustomerService 5039 ev-dealer-management/ev-dealer-management/CustomerService/CustomerService.csproj
          start_service NotificationService 5051 ev-dealer-management/ev-dealer-management/NotificationService/NotificationService.csproj
          start_service ReportingService 5208 ev-dealer-management/ev-dealer-management/ReportingService/ReportingService.csproj

          wait_for_port 7001 UserService
          wait_for_port 5039 CustomerService
          wait_for_port 5051 NotificationService
          wait_for_port 5208 ReportingService

          wait_for_port 5672 RabbitMQ

          start_service VehicleService 5068 ev-dealer-management/ev-dealer-management/VehicleService/VehicleService.csproj
          start_service SalesService 5003 ev-dealer-management/ev-dealer-management/SalesService/SalesService.csproj

          wait_for_port 5068 VehicleService
          wait_for_port 5003 SalesService

          start_service APIGatewayService 5036 ev-dealer-management/ev-dealer-management/APIGatewayService/APIGatewayService.csproj
          wait_for_port 5036 APIGatewayService

      - name: Run Postman API Tests
        id: api_tests
        shell: bash
        run: |
          set -euo pipefail
          # Định vị động file Postman mà Tiến push lên thư mục gốc để chạy test
          POSTMAN_FILE=$(find . -maxdepth 1 -name "*.json" | head -n 1)
          if [ ! -f "$POSTMAN_FILE" ]; then
            POSTMAN_FILE="ev-dealer-management/ev-dealer-management/EV Dealer Management API.postman_collection.json"
          fi
          echo "Executing Newman with target collection: $POSTMAN_FILE"

          # ĐÃ SỬA: Đưa cả 2 biến về chung một gốc không chứa /api để tránh trùng lặp
          newman run "$POSTMAN_FILE" \
            --env-var "baseUrl=http://127.0.0.1:5036" \
            --env-var "base_url=http://127.0.0.1:5036" \
            --reporters cli 2>&1 | tee newman.log

      - name: Jira comment on FAIL
        if: failure() && github.ref != 'refs/heads/main' && steps.jira_keys.outputs.branch_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_KEYS: ${{ steps.jira_keys.outputs.branch_key }}
          JIRA_BRANCH_TYPE: ${{ steps.jira_keys.outputs.branch_type }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/jira-sync.mjs FAIL

      - name: Publish PASS test report
        if: success()
        env:
          TEST_STATUS: PASS
          POSTMAN_VALIDATION_OUTCOME: ${{ steps.postman_validation.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          SERVICES_OUTCOME: ${{ steps.services.outcome }}
          API_TESTS_OUTCOME: ${{ steps.api_tests.outcome }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira-test-report.mjs PASS

      - name: Jira update on PASS
        if: success() && steps.jira_keys.outputs.branch_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_KEYS: ${{ steps.jira_keys.outputs.branch_key }}
          JIRA_BRANCH_TYPE: ${{ steps.jira_keys.outputs.branch_type }}
          JIRA_TRANSITION_IN_PROGRESS: ${{ secrets.JIRA_TRANSITION_IN_PROGRESS }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/jira-sync.mjs PASS

      - name: Create Jira Bug only when needed
        if: failure() && github.ref != 'refs/heads/main' && steps.jira_keys.outputs.branch_type == 'feature' && steps.jira_keys.outputs.is_module_parent == 'true'
        env:
          TEST_STATUS: FAIL
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_REPORTER_ACCOUNT_ID: ${{ secrets.JIRA_REPORTER_ACCOUNT_ID }}
          JIRA_DEFAULT_ASSIGNEE_ACCOUNT_ID: ${{ secrets.JIRA_DEFAULT_ASSIGNEE_ACCOUNT_ID }}
          JIRA_LINK_ISSUE_KEY: ${{ steps.jira_keys.outputs.branch_key }}
          POSTMAN_VALIDATION_OUTCOME: ${{ steps.postman_validation.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UNIT_TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          SERVICES_OUTCOME: ${{ steps.services.outcome }}
          API_TESTS_OUTCOME: ${{ steps.api_tests.outcome }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/scripts/jira-test-report.mjs FAIL

  merge-pr-to-done:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Jira issue keys from merged PR
        id: jira_keys
        shell: bash
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          branch_type="other"
          primary_key=""

          if [[ "$branch" =~ ^(feature|fix|hotfix|chore)/(ED-[0-9]+)(-|$) ]]; then
            branch_type="${BASH_REMATCH[1]}"
            primary_key="${BASH_REMATCH[2]}"
          fi

          echo "branch_type=$branch_type" >> "$GITHUB_OUTPUT"
          echo "branch_key=$primary_key" >> "$GITHUB_OUTPUT"
          echo "keys=$primary_key" >> "$GITHUB_OUTPUT"

          echo "Detected branch type: $branch_type"
          echo "Jira key detected: $([[ -n "$primary_key" ]] && echo true || echo false)"
          echo "Raw branch and Jira key are not printed because GitHub may mask text matching a secret."

      - name: Move Jira issues to Done after merged PR
        if: (steps.jira_keys.outputs.branch_type == 'fix' || steps.jira_keys.outputs.branch_type == 'hotfix') && steps.jira_keys.outputs.branch_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
          JIRA_ISSUE_KEYS: ${{ steps.jira_keys.outputs.branch_key }}
          JIRA_BRANCH_TYPE: ${{ steps.jira_keys.outputs.branch_type }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.event.pull_request.head.ref }}
          JIRA_TRANSITION_DONE: Done
        run: node .github/scripts/jira-sync.mjs DONE
