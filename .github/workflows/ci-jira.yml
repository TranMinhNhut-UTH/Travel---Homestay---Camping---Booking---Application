name: CI and Jira Sync

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - closed

jobs:
  push-ci-and-in-progress:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Validate branch naming
        shell: bash
        run: |
          branch="${{ github.event.pull_request.head.ref || github.ref_name }}"
          allowed='^(main|develop|release/[0-9]+\.[0-9]+\.[0-9]+|feature/ED-[0-9]+[-a-z0-9_]*|...)$'
          if [[ ! "$branch" =~ $allowed ]]; then
            echo "Branch name '$branch' does not match the required pattern."
            echo "Use main, develop, release/x.y.z, feature/ED-123-desc, fix/ED-123-desc, hotfix/ED-123-desc, or chore/ED-123-desc."
            exit 1
          fi

      - name: Extract Jira issue keys
        id: jira_keys
        shell: bash
        run: |
          branch="${{ github.ref_name }}"
          branch_type="other"
          if [[ "$branch" == feature/* ]]; then
            branch_type="feature"
          elif [[ "$branch" == fix/* ]]; then
            branch_type="fix"
          elif [[ "$branch" == hotfix/* ]]; then
            branch_type="hotfix"
          elif [[ "$branch" == chore/* ]]; then
            branch_type="chore"
          fi

          primary_key=$(printf '%s' "$branch" | grep -oE 'ED-[0-9]+' | head -n1 || true)

          echo "branch_type=$branch_type" >> "$GITHUB_OUTPUT"
          echo "branch_key=$primary_key" >> "$GITHUB_OUTPUT"
          echo "keys=$primary_key" >> "$GITHUB_OUTPUT"

          echo "Detected branch: $branch"
          echo "Detected branch type: $branch_type"
          echo "Detected branch issue key: ${primary_key:-<none>}"

      - name: Validate Postman collection
        shell: bash
        run: |
          set -o pipefail
          POSTMAN_FILE="./ev-dealer-management.postman_collection.json"
          if [ -f "$POSTMAN_FILE" ]; then
            node .github/scripts/validate-postman.mjs "$POSTMAN_FILE" 2>&1 | tee postman-validation.log
          else
            echo "Error: ev-dealer-management.postman_collection.json not found in root!"
            exit 1
          fi

      - name: Restore solution
        run: dotnet restore ev-dealer-management/ev-dealer-management/DealerSystem.sln

      - name: Build solution
        shell: bash
        run: |
          set -o pipefail
          dotnet build ev-dealer-management/ev-dealer-management/DealerSystem.sln --configuration Release --no-restore 2>&1 | tee dotnet-build.log

      - name: Start backend services
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          wait_for_port() {
            local port="$1"
            local name="$2"
            for _ in $(seq 1 60); do
              if timeout 1 bash -c "</dev/tcp/127.0.0.1/${port}" >/dev/null 2>&1; then
                echo "${name} is ready on ${port}"
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for ${name} on port ${port}"
            exit 1
          }

          start_service() {
            local name="$1"
            local port="$2"
            local project="$3"
            echo "Starting ${name} on ${port}"
            nohup env ASPNETCORE_URLS="http://127.0.0.1:${port}" dotnet run --project "${project}" --no-launch-profile > "ci-logs/${name}.log" 2>&1 &
          }

          docker compose -f ev-dealer-management/ev-dealer-management/docker-compose.yml up -d rabbitmq

          start_service UserService 7001 ev-dealer-management/ev-dealer-management/UserService/UserService.csproj
          start_service CustomerService 5039 ev-dealer-management/ev-dealer-management/CustomerService/CustomerService.csproj
          start_service NotificationService 5051 ev-dealer-management/ev-dealer-management/NotificationService/NotificationService.csproj
          start_service ReportingService 5208 ev-dealer-management/ev-dealer-management/ReportingService/ReportingService.csproj

          wait_for_port 7001 UserService
          wait_for_port 5039 CustomerService
          wait_for_port 5051 NotificationService
          wait_for_port 5208 ReportingService

          wait_for_port 5672 RabbitMQ

          start_service VehicleService 5068 ev-dealer-management/ev-dealer-management/VehicleService/VehicleService.csproj
          start_service SalesService 5003 ev-dealer-management/ev-dealer-management/SalesService/SalesService.csproj

          wait_for_port 5068 VehicleService
          wait_for_port 5003 SalesService

          start_service APIGatewayService 5036 ev-dealer-management/ev-dealer-management/APIGatewayService/APIGatewayService.csproj
          wait_for_port 5036 APIGatewayService

      - name: Run Postman API Tests
        shell: bash
        run: |
          set -euo pipefail
          # Định vị động file Postman mà Tiến push lên thư mục gốc để chạy test
          POSTMAN_FILE=$(find . -maxdepth 1 -name "*.postman_collection.json" | head -n 1)
          if [ ! -f "$POSTMAN_FILE" ]; then
            POSTMAN_FILE="ev-dealer-management/ev-dealer-management/EV Dealer Management API.postman_collection.json"
          fi
          echo "Executing Newman with target collection: $POSTMAN_FILE"
          
          # ĐÃ SỬA: Đưa cả 2 biến về chung một gốc không chứa /api để tránh trùng lặp
          newman run "$POSTMAN_FILE" \
            --env-var "baseUrl=http://127.0.0.1:5036" \
            --env-var "base_url=http://127.0.0.1:5036" \
            --reporters cli 2>&1 | tee newman.log

      - name: Comment failure back to Jira
        if: failure() && github.ref != 'refs/heads/main'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEYS: ${{ steps.jira_keys.outputs.branch_key }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node .github/scripts/jira-sync.mjs FAIL

      - name: Create Jira issue on CI failure
        if: failure() && github.ref != 'refs/heads/main' && steps.jira_keys.outputs.branch_type == 'feature' && steps.jira_keys.outputs.branch_key != ''
        shell: bash
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ED
          JIRA_ISSUE_TYPE: Bug
          JIRA_LINK_ISSUE_KEY: ${{ steps.jira_keys.outputs.branch_key }}
          JIRA_BRANCH_TYPE: ${{ steps.jira_keys.outputs.branch_type }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createIssue, buildIssueFields, linkIssues } from './.github/scripts/jira-client.mjs';

          const workflowName = process.env.GITHUB_WORKFLOW_NAME || 'CI';
          const branchKey = process.env.JIRA_LINK_ISSUE_KEY || '';
          const branchType = process.env.JIRA_BRANCH_TYPE || 'unknown';
          console.log(`Detected branch type: ${branchType}`);
          console.log(`Detected parent issue key: ${branchKey || '<none>'}`);
          const postmanLog = fs.existsSync('postman-validation.log') ? fs.readFileSync('postman-validation.log', 'utf8').trim() : '(not available)';
          const buildLog = fs.existsSync('dotnet-build.log') ? fs.readFileSync('dotnet-build.log', 'utf8').trim() : '(not available)';
          const newmanLog = fs.existsSync('newman.log') ? fs.readFileSync('newman.log', 'utf8').trim() : '(not available)';
          const description = [
            `Workflow: ${workflowName}`,
            `Run: ${process.env.GITHUB_RUN_URL || ''}`,
            `Branch: ${process.env.GITHUB_REF_NAME || ''}`,
            branchKey ? `Source issue: ${branchKey}` : '',
            '',
            'Failed paths:',
            '- Integration API collection tests failed.',
            '',
            'Postman log:',
            postmanLog,
            '',
            'Build log:',
            buildLog,
            '',
            'Newman log:',
            newmanLog,
          ].join('\n');

          const fields = buildIssueFields({
            projectKey: process.env.JIRA_PROJECT_KEY || 'ED',
            summary: `CI Failure: ${workflowName} - Integration Error detected on ${branchKey}`,
            description,
            issueType: process.env.JIRA_ISSUE_TYPE || 'Bug',
            labels: ['automation', 'ci-failure'],
          });

          const result = await createIssue({
            baseUrl: process.env.JIRA_BASE_URL,
            email: process.env.JIRA_EMAIL,
            apiToken: process.env.JIRA_API_TOKEN,
            fields,
          });
          console.log(`Dynamically created bug key: ${result.key}`);

          if (branchKey) {
            await linkIssues({
              baseUrl: process.env.JIRA_BASE_URL,
              email: process.env.JIRA_EMAIL,
              apiToken: process.env.JIRA_API_TOKEN,
              outwardIssueKey: result.key,
              indexKey: branchKey,
              inwardIssueKey: branchKey,
              linkType: 'Relates',
            });
            console.log(`Linked issues: ${result.key} -> ${branchKey}`);
          }

          console.log(JSON.stringify(result, null, 2));
          NODE

  merge-pr-to-done:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Jira issue keys from merged PR
        id: jira_keys
        shell: bash
        run: |
          branch="${{ github.event.pull_request.head.ref }}"
          branch_type="other"
          if [[ "$branch" == feature/* ]]; then
            branch_type="feature"
          elif [[ "$branch" == fix/* ]]; then
            branch_type="fix"
          elif [[ "$branch" == hotfix/* ]]; then
            branch_type="hotfix"
          elif [[ "$branch" == chore/* ]]; then
            branch_type="chore"
          fi

          primary_key=$(printf '%s' "$branch" | grep -oE 'ED-[0-9]+' | head -n1 || true)
          echo "branch_type=$branch_type" >> "$GITHUB_OUTPUT"
          echo "branch_key=$primary_key" >> "$GITHUB_OUTPUT"
          echo "keys=$primary_key" >> "$GITHUB_OUTPUT"

          echo "Detected PR branch: $branch"
          echo "Detected branch type: $branch_type"
          echo "Detected branch issue key: ${primary_key:-<none>}"

      - name: Move Jira issues to Done after merged PR
        if: (steps.jira_keys.outputs.branch_type == 'fix' || steps.jira_keys.outputs.branch_type == 'feature') && steps.jira_keys.outputs.branch_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEYS: ${{ steps.jira_keys.outputs.branch_key }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.event.pull_request.head.ref }}
          JIRA_TRANSITION_DONE: Done
        run: node .github/scripts/jira-sync.mjs DONE