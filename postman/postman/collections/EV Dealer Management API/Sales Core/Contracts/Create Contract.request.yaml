$kind: http-request
url: "{{baseUrl}}/api/Contracts"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
body:
  type: text
  content: |-
    {
      "orderId": {{orderId}},
      "customerId": {{customerId}},
      "salespersonId": "1",
      "contractDate": "2026-06-10T09:00:00Z",
      "depositAmountReceived": true,
      "termsAndConditions": "Demo contract"
    }
order: 3000
