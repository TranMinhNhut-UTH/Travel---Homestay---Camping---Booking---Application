$kind: http-request
url: "{{baseUrl}}/api/Orders/complete"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
body:
  type: text
  content: |-
    {
      "quoteId": {{quoteId}},
      "customerId": {{customerId}},
      "customerEmail": "customer@example.com",
      "customerName": "Nguyen Van B",
      "dealerId": {{dealerId}},
      "salespersonId": 1,
      "paymentMethod": "Cash",
      "deliveryDate": "2026-06-10T09:00:00Z",
      "estimatedDeliveryDate": "2026-06-15T09:00:00Z",
      "notes": "Complete order demo",
      "paymentType": "Full",
      "depositAmount": 0,
      "interestRateYearly": 0,
      "loanTermMonths": 0,
      "vehicleId": {{vehicleId}},
      "vehicleVariantId": 1,
      "colorId": 1,
      "quantity": 1,
      "unitPrice": 1200000000,
      "totalAmount": 1200000000,
      "promotionId": null,
      "discountAmount": 0,
      "discountPercent": 0,
      "discountNote": ""
    }
order: 1000
