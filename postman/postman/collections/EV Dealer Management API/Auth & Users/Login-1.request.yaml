$kind: http-request
name: Login
url: http://localhost:7001/api/auth/login
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Nguyen Van B",
      "email": "{{randomEmail}}",
      "phone": "+84923456789",
      "address": "Ha Noi",
      "dealerId": 1,
      "status": "active"
    }
scripts:
  - type: beforeRequest
    code: "pm.environment.set(\r

      \  \"randomEmail\",\r

      \  \"customer\" + Date.now() + \"@example.com\"\r

      );"
    language: text/javascript
order: 1000
