$kind: http-request
name: Create Test Drive
url: http://localhost:5039/api/TestDrives
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{authToken}}
body:
  type: text
  content: |-
    {
      "customerId": {{customerId}},
      "vehicleId": {{vehicleId}},
      "dealerId": {{dealerId}},
      "appointmentDate": "2026-06-01T09:00:00Z",
      "notes": "Morning slot",
      "status": "Scheduled"
    }
scripts:
  - type: afterResponse
    code: "pm.test(\"Test Drive created\", function () {\r

      \    pm.expect(pm.response.code).to.be.oneOf([200, 201]);\r

      });\r

      \r

      const data = pm.response.json();\r

      \r

      if (data.id) {\r

      \    pm.environment.set(\"testDriveId\", data.id);\r

      }"
    language: text/javascript
order: 9000
